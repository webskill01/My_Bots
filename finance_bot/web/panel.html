<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbf8">
<meta name="robots" content="noindex">
<title>Finance</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* mobile first; same design system as the Schedule panel */
  :root {
    --bg: #fbfbf8; --card: #fff; --ink: #1d1d1b; --muted: #62676a; --line: #e6e6e1; --soft: #f2f2ee;
    --accent: #0b6e76; --accent-soft: #e2f1f2;
    --deep: #a8660b; --deep-soft: #fbf0df; --ok: #1f7a4a; --ok-soft: #e1f3e8; --bad: #b3261e; --bad-soft: #fbe6e4;
    --spend: #c2410c; --spend-soft: #fdeee4;
    --r: 16px; --nav-h: 60px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  a { color: inherit; }
  p { margin: 0; }
  h1 { font-size: 21px; line-height: 1.15; letter-spacing: -.03em; margin: 0; }
  h2 { font-size: 14.5px; margin: 0 0 8px; letter-spacing: -.01em; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -.02em; font-size: 16px; text-decoration: none; white-space: nowrap; flex: none; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; }

  /* shell: phones and tablets get a bottom tab bar, desktop puts tabs up top */
  .top { position: sticky; top: 0; z-index: 5; background: rgba(251,251,248,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .top-in { max-width: 1240px; margin: 0 auto; padding: 8px max(12px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 10px; min-height: 52px; }
  .top .tabs { display: none; }
  .who { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  html, body { overflow-x: hidden; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px max(12px, env(safe-area-inset-left)) calc(var(--nav-h) + 96px + env(safe-area-inset-bottom)); }
  @media (min-width: 600px) { main { padding-left: 20px; padding-right: 20px; } .top-in { padding-left: 20px; padding-right: 20px; } }
  .bottom { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .bottom a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; text-decoration: none; font-size: 11.5px; font-weight: 700; color: var(--muted); border-radius: 12px; }
  .bottom svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bottom a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
  @media (min-width: 600px) { .bottom { padding-left: max(6px, calc(50vw - 300px)); padding-right: max(6px, calc(50vw - 300px)); } h1 { font-size: 24px; } }
  @media (min-width: 960px) {
    .top .tabs { display: flex; gap: 2px; min-width: 0; }
    .top .tabs a { text-decoration: none; font-weight: 700; font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 12px; white-space: nowrap; }
    .top .tabs a[aria-current="page"] { color: var(--ink); background: var(--soft); }
    .bottom { display: none; }
    main { padding: 24px 24px 96px; }
    .top-in { padding-left: 24px; padding-right: 24px; }
  }
  .head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 14px; }
  .head > div:first-child { min-width: 0; }
  .head .sub { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  @media (min-width: 600px) { .head { grid-template-columns: minmax(0, 1fr) auto; } }
  .nav { display: grid; grid-template-columns: 40px 112px 40px; gap: 6px; justify-content: start; }
  .nav .b { padding-left: 6px; padding-right: 6px; }
  .nav .gap { opacity: .45; pointer-events: none; background: var(--soft); border-color: transparent; }

  /* cards & controls */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 10px; }
  @media (min-width: 600px) { .card { padding: 16px; } }
  label { display: block; font-size: 12.5px; font-weight: 700; margin: 12px 0 5px; }
  input, select { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; outline: none; min-height: 42px; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type="date"] { min-width: 0; -webkit-appearance: none; appearance: none; }
  .b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; text-decoration: none; background: var(--soft); color: var(--ink); white-space: nowrap; }
  .b.primary { background: var(--accent); color: #fff; }
  .b.warn { background: var(--bad-soft); color: var(--bad); }
  .b.line { background: var(--card); border: 1.5px solid var(--line); }
  .b.sm { min-height: 32px; padding: 5px 10px; font-size: 12.5px; }
  .b.icon { width: 40px; padding: 0; }
  .b.full { width: 100%; padding: 11px; font-size: 15px; }
  .b svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .b:disabled { opacity: .45; cursor: default; }
  :is(.b, .bottom a, .tabs a, .chip, .row, .barcol, .mon):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
  .acts.fill > .b { flex: 1 1 0; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--tc); background: color-mix(in srgb, var(--tc) 12%, #fff); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 22px 16px; text-align: center; border: 1.5px dashed var(--line); border-radius: var(--r); }
  .err { color: var(--bad); font-weight: 600; font-size: 13.5px; margin-top: 10px; }
  .note { font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--soft); margin-top: 12px; }
  .note.warn { background: var(--deep-soft); color: var(--deep); font-weight: 600; }
  .note.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hint code { background: var(--soft); border-radius: 5px; padding: 0 5px; font-size: 11.5px; }

  /* quick add */
  .add { padding: 10px; margin-bottom: 14px; }
  .add-top { display: flex; gap: 8px; }
  .add-top input { flex: 1; min-width: 0; font-weight: 600; }
  @media (max-width: 599px) { #qForm { display: none; } }   /* phones: the + button opens the form */

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  @media (min-width: 760px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .tile .l { font-size: 12px; font-weight: 700; color: var(--muted); }
  .tile .v { font-size: 21px; font-weight: 800; letter-spacing: -.04em; line-height: 1.2; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .tile.spent .v { color: var(--spend); }
  .tile.earned .v, .pos { color: var(--ok); }
  .neg { color: var(--bad); }
  .budget { margin-bottom: 10px; }
  .budget .top-l { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .meter { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
  .meter i { display: block; height: 100%; width: calc(var(--v) * 1%); background: var(--tc, var(--ok)); border-radius: 4px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
  .budget .meter { height: 12px; border-radius: 6px; }
  .grid2 { display: grid; gap: 10px; }
  @media (min-width: 960px) { .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }

  /* bars: one per day of the month */
  .bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; align-items: end; height: 150px; margin-top: 6px; }
  @media (min-width: 600px) { .bars { gap: 4px; } }
  .barcol { display: grid; grid-template-rows: 1fr auto; height: 100%; text-decoration: none; text-align: center; gap: 4px; min-width: 0; }
  .barcol .bt { background: var(--soft); border-radius: 4px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  .barcol .bt i { display: block; width: 100%; height: calc(var(--v) * 1%); background: var(--spend); transition: height .8s cubic-bezier(.2, .8, .2, 1); }
  .barcol.today .bt i { background: var(--accent); }
  .barcol.future .bt { background: transparent; border: 1px dashed var(--line); }
  .barcol:hover .bt { background: #e9e9e3; }
  .barcol .bl { font-size: 10px; font-weight: 700; color: var(--muted); }
  .barcol .bl.hide { visibility: hidden; }
  @media (min-width: 600px) { .barcol .bl.hide { visibility: visible; } }

  .mrow { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; text-decoration: none; }
  .mrow:first-of-type { border-top: 0; }
  .mrow .ml { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .mrow .mv { text-align: right; font-weight: 700; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mrow .mv small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  a.mrow:hover .ml { color: var(--accent); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--tc); flex: none; }

  /* entries */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .day-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 18px 2px 6px; font-size: 13px; }
  .day-h b { font-size: 14px; }
  .day-h span { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .list { display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--tc, var(--line)); border-radius: 12px; padding: 9px 12px; min-height: 52px; cursor: pointer; }
  .row:hover { border-color: #d6d6cf; border-left-color: var(--tc, #d6d6cf); }
  .row .t1 { font-weight: 700; font-size: 14.5px; overflow-wrap: anywhere; }
  .row .t2 { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .row .amt { font-weight: 800; font-size: 15px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row.earn .amt { color: var(--ok); }
  .search { margin-bottom: 10px; }

  /* months */
  .mon { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; }
  .mon:first-of-type { border-top: 0; }
  .mon .mn b { display: block; font-size: 14px; }
  .mon .mn span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .mon .pair { display: grid; gap: 5px; }
  .mon .pl { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mon .pl span { text-align: right; white-space: nowrap; }
  .mon .net { grid-column: 2; font-size: 12px; font-weight: 700; color: var(--muted); }
  .mon.cur .mn b { color: var(--accent); }
  .mon:hover .mn b { color: var(--accent); }
  @media (min-width: 600px) { .mon { grid-template-columns: 120px minmax(0, 1fr) 110px; } .mon .net { grid-column: 3; text-align: right; } .mon .pl { grid-template-columns: minmax(0, 1fr) 110px; } }

  /* settings */
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .srow:first-of-type { border-top: 0; padding-top: 4px; }
  .srow .tx { min-width: 0; }
  .srow .tx b { display: block; font-size: 14px; }
  .srow .tx span { font-size: 12.5px; color: var(--muted); }
  .inrow { display: flex; gap: 8px; }
  .link { display: flex; gap: 6px; align-items: center; margin-top: 10px; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--ok-soft); }
  .link code { flex: 1; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ok); font-weight: 600; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px; background: var(--soft); color: var(--muted); }
  .pill.off { background: var(--bad-soft); color: var(--bad); }
  .pill.admin { background: var(--accent-soft); color: var(--accent); }
  .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 499px) { .three { grid-template-columns: minmax(0, 1fr); gap: 0; } }

  .fab { position: fixed; right: 16px; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom)); z-index: 6; width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(11,110,118,.35); cursor: pointer; }
  .fab svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; fill: none; }
  @media (min-width: 960px) { .fab { bottom: 28px; right: max(24px, calc(50vw - 600px)); } }

  dialog { border: 0; border-radius: 20px; padding: 18px; width: min(440px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow-y: auto; overscroll-behavior: contain; box-shadow: 0 20px 60px rgba(0,0,0,.25); color: var(--ink); }
  dialog::backdrop { background: rgba(20,20,18,.45); }
  dialog h2 { font-size: 18px; margin-bottom: 6px; }
  dialog p { color: var(--muted); font-size: 14px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--soft); border-radius: 12px; padding: 4px; margin-top: 12px; }
  .seg button { border: 0; background: none; font: inherit; font-weight: 700; font-size: 13.5px; padding: 8px; border-radius: 9px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .seg button[data-kind="exp"][aria-pressed="true"] { color: var(--spend); }
  .seg button[data-kind="earn"][aria-pressed="true"] { color: var(--ok); }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 399px) { dialog .two { grid-template-columns: minmax(0, 1fr); gap: 0; } }


  /* calendar: one month, each day shaded by what was spent */
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-h { font-size: 11px; font-weight: 800; color: var(--muted); text-align: center; padding-bottom: 2px; }
  .cd { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 52px; padding: 5px 6px; border-radius: 10px; background: var(--soft); text-decoration: none; min-width: 0; }
  .cd b { font-size: 12.5px; line-height: 1; }
  .cd span { font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .cd.lv1 { background: color-mix(in srgb, var(--spend) 14%, #fff); }
  .cd.lv2 { background: color-mix(in srgb, var(--spend) 30%, #fff); }
  .cd.lv3 { background: color-mix(in srgb, var(--spend) 50%, #fff); color: #fff; }
  .cd.lv4 { background: var(--spend); color: #fff; }
  .cd.today { box-shadow: 0 0 0 2px var(--accent); }
  .cd.future { opacity: .35; pointer-events: none; background: transparent; border: 1px dashed var(--line); }
  .cd:hover { filter: brightness(.96); }
  @media (max-width: 599px) { .cd { padding: 4px 4px 9px; } .cd span { font-size: 9.5px; letter-spacing: -.02em; } }
  @media (max-width: 360px) { .cd span { font-size: 8.5px; letter-spacing: -.04em; } .cd { padding-left: 3px; padding-right: 3px; } }
  @media (min-width: 600px) { .cd { min-height: 62px; padding: 7px 8px; } .cd span { font-size: 11.5px; } }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

  /* a day */
  .row.timed { grid-template-columns: 54px minmax(0, 1fr) auto; }
  .row .tm { font-size: 12.5px; font-weight: 800; color: var(--muted); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .row .tm small { display: block; font-size: 10.5px; font-weight: 700; }
  .split { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 4px; }
  .split i { flex: var(--v) 1 0; background: var(--tc); min-width: 4px; }
  .day-h a { text-decoration: none; }
  .day-h a:hover b { color: var(--accent); }
  .add-day { width: 100%; margin: 10px 0 4px; }
  .sec-h { margin: 16px 2px 8px; } .sec-h h2 { margin: 0; font-size: 14px; color: var(--muted); }

  /* the multi-item form */
  dialog.wide { width: min(680px, calc(100vw - 24px)); }
  #edit { margin-top: max(12px, 5vh); }   /* grows downward: rows added never shift what you're about to tap */
  .f-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .f-head h2 { margin: 0; }
  .f-date { margin: 0; font-size: 11.5px; color: var(--muted); flex: none; }
  .f-date input { min-height: 38px; padding: 6px 10px; width: 160px; }
  @media (max-width: 499px) { .f-head { flex-wrap: wrap; } .f-date, .f-date input { width: 100%; } }
  .f-lbl { font-size: 11.5px; font-weight: 700; color: var(--muted); margin: 8px 0 5px; }
  .chips.wrap { flex-wrap: wrap; overflow: visible; margin-bottom: 4px; }
  @media (max-width: 599px) { #recent { flex-wrap: nowrap; overflow-x: auto; } }   /* one swipeable row on phones */
  .chip.sm { padding: 4px 10px; font-size: 12.5px; }
  .chip .pos { font-weight: 800; }
  .item { display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 36px; grid-template-areas: "k amt amt rm" "name name cat cat" "new new new new"; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; background: var(--bg); }
  .item input, .item select { min-height: 40px; padding: 7px 10px; }
  .item .kb { grid-area: k; } .item .ia { grid-area: amt; font-weight: 700; } .item .in { grid-area: name; } .item .ic { grid-area: cat; } .item .inew { grid-area: new; } .item .rm { grid-area: rm; }
  @media (min-width: 600px) {
    .item { grid-template-columns: 40px 120px minmax(0, 1.3fr) minmax(0, 1fr) 36px; grid-template-areas: "k amt name cat rm" ". new new new ."; }
  }
  .kb { border: 0; border-radius: 10px; font: inherit; font-size: 20px; font-weight: 800; cursor: pointer; line-height: 1; }
  .kb.exp { background: var(--spend-soft); color: var(--spend); }
  .kb.earn { background: var(--ok-soft); color: var(--ok); }
  .rm { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; border-radius: 8px; }
  .rm:hover { background: var(--soft); color: var(--bad); }
  .f-total { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .f-total:empty { display: none; }

  /* the month card on Entries: name, totals, calendar; swipe to change month */
  .month { padding: 12px 12px 10px; touch-action: pan-y; transition: transform .25s cubic-bezier(.2, .8, .2, 1); outline: none; }
  @media (min-width: 600px) { .month { padding: 16px 18px 14px; } }
  .m-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .m-name { flex: 1; min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
  .m-name h1 { font-size: 22px; }
  .pill.now { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
  .chev { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; cursor: pointer; color: var(--ink); transition: background .15s, transform .15s; }
  .chev:hover:not(:disabled) { background: var(--soft); }
  .chev:active:not(:disabled) { transform: scale(.92); }
  .chev:disabled { opacity: .3; cursor: default; }
  .chev svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .swipe-hint { display: none; }
  @media (hover: none) and (pointer: coarse) { .chev { display: none; } .swipe-hint { display: inline; } }
  .m-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
  .m-stats div { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 7px 9px; min-width: 0; }
  .m-stats span { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
  .m-stats b { display: block; font-size: 15.5px; font-weight: 800; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .m-stats b.sp { color: var(--spend); }
  @media (max-width: 420px) { .m-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 600px) { .m-stats b { font-size: 19px; } .m-stats div { padding: 9px 12px; } }
  .m-budget { height: 6px; margin: -2px 0 12px; }
  /* earned: a green bar filling along the bottom of the day, longer = more */
  .cd .eb { position: absolute; left: 4px; bottom: 3px; height: 4px; width: calc((100% - 8px) * var(--f)); border-radius: 2px; background: var(--ok); box-shadow: 0 0 0 1.5px rgba(255,255,255,.85); transform-origin: left; }
  .cd .ea { display: none; font-style: normal; font-size: 11px; font-weight: 800; color: var(--ok); }
  .cd.lv3 .ea, .cd.lv4 .ea { color: #fff; }
  @media (min-width: 760px) { .cd { min-height: 72px; } .cd .ea { display: block; margin-bottom: 4px; } }
  .back { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; margin: -4px 0 4px -4px; padding: 2px 6px 2px 2px; border-radius: 8px; }
  .back svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .back:hover { background: var(--accent-soft); }

  /* motion: short and quiet. A new page fades up, swipes slide, numbers settle. */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
  @keyframes slideFromR { from { opacity: 0; transform: translateX(28px); } }
  @keyframes slideFromL { from { opacity: 0; transform: translateX(-28px); } }
  @keyframes cellIn { from { opacity: 0; transform: scale(.88); } }
  @keyframes growX { from { transform: scaleX(0); } }
  @keyframes growY { from { transform: scaleY(0); } }
  @keyframes dlgIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  @keyframes fade { from { opacity: 0; } }
  .enter > * { animation: fadeUp .38s cubic-bezier(.2, .8, .2, 1) backwards; }
  .enter > :nth-child(2) { animation-delay: .04s; } .enter > :nth-child(3) { animation-delay: .08s; }
  .enter > :nth-child(4) { animation-delay: .12s; } .enter > :nth-child(n+5) { animation-delay: .16s; }
  .slide-r { animation: slideFromR .32s cubic-bezier(.2, .8, .2, 1); }
  .slide-l { animation: slideFromL .32s cubic-bezier(.2, .8, .2, 1); }
  :is(.enter, .month[class*="slide-"]) .cd { animation: cellIn .32s calc(var(--i) * 9ms + .05s) cubic-bezier(.2, .8, .2, 1) backwards; }
  :is(.enter, .month[class*="slide-"], .slide-r, .slide-l) :is(.meter i, .eb) { animation: growX .8s .15s cubic-bezier(.2, .8, .2, 1) backwards; transform-origin: left; }
  .enter .barcol .bt i { animation: growY .8s calc(var(--i, 0) * 12ms + .1s) cubic-bezier(.2, .8, .2, 1) backwards; transform-origin: bottom; }
  .enter .split i { animation: growX .7s .15s cubic-bezier(.2, .8, .2, 1) backwards; transform-origin: left; }
  dialog[open] { animation: dlgIn .22s cubic-bezier(.2, .8, .2, 1); }
  dialog[open]::backdrop { animation: fade .22s ease; }
  .item { animation: fadeUp .22s cubic-bezier(.2, .8, .2, 1); }
  .row, .cd, .chip, .b { transition: transform .15s ease, box-shadow .15s ease, background .15s ease, filter .15s ease; }
  .row:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.05); }
  .row:active, .cd:active, .b:active:not(:disabled), .chip:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) {
    .enter > *, .slide-r, .slide-l, .cd, .meter i, .eb, .barcol .bt i, .split i, dialog[open], dialog[open]::backdrop, .item { animation: none !important; }
    .row, .cd, .chip, .b, .month { transition: none; }
    .row:hover, .row:active, .cd:active, .b:active, .chip:active { transform: none; }
  }
  .toast { position: fixed; left: 12px; right: 12px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); max-width: 440px; margin: 0 auto; background: var(--ink); color: #fff; padding: 13px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; transform: translateY(calc(100% + 160px)); visibility: hidden; transition: transform .25s ease, visibility .25s; z-index: 30; }
  @media (min-width: 960px) { .toast { bottom: 24px; } }
  .toast.show { transform: none; visibility: visible; }
  .toast.err { background: var(--bad); }
  .spin { width: 22px; height: 22px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; margin: 60px auto; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .toast, .meter i, .barcol .bt i { transition: none; } .spin { animation-duration: 3s; } }
</style>
</head>
<body>
<section id="login" hidden>
  <main style="max-width:380px;padding-top:14vh">
    <p class="brand" style="justify-content:center;margin-bottom:6px"><img src="/icon-192.png" alt="">Finance</p>
    <p class="muted" style="text-align:center;margin-bottom:18px">Spending and earnings, month by month</p>
    <form class="card" id="loginForm">
      <label for="un" style="margin-top:0">Name</label>
      <input id="un" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="b primary full" type="submit" style="margin-top:14px">Log in</button>
      <p class="err" id="loginErr" hidden></p>
    </form>
    <p class="muted small" style="text-align:center;margin-top:12px">New here? Ask for an invite link.</p>
  </main>
</section>

<section id="joinSec" hidden>
  <main style="max-width:380px;padding-top:10vh">
    <p class="brand" style="justify-content:center;margin-bottom:6px"><img src="/icon-192.png" alt="">Finance</p>
    <p class="muted" style="text-align:center;margin-bottom:18px" id="joinSub">Create your account</p>
    <form class="card" id="joinForm">
      <label for="jName" style="margin-top:0">Your name</label>
      <input id="jName" autocomplete="username" autocapitalize="words" required minlength="2" maxlength="32">
      <p class="hint">You'll log in with this. Letters, numbers, spaces.</p>
      <label for="jPw">Password</label>
      <input id="jPw" type="password" autocomplete="new-password" required minlength="6">
      <label for="jPw2">Password again</label>
      <input id="jPw2" type="password" autocomplete="new-password" required minlength="6">
      <button class="b primary full" type="submit" style="margin-top:14px">Create account</button>
      <p class="err" id="joinErr" hidden></p>
    </form>
  </main>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#overview"><img src="/icon-192.png" alt=""><span>Finance</span></a>
      <nav class="tabs" aria-label="Sections"></nav>
      <span class="who" id="who"></span>
    </div>
  </header>
  <main id="view"><div class="spin"></div></main>
  <nav class="bottom" aria-label="Sections"></nav>
  <button class="fab" id="fab" type="button" aria-label="Add an entry"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<dialog id="edit" aria-labelledby="editTitle">
  <form id="editForm" method="dialog" autocomplete="off">
    <div class="f-head">
      <div><h2 id="editTitle">Add items</h2><p class="small" id="editSub"></p></div>
      <label class="f-date"><span>Day</span><input id="fDate" type="date" required></label>
    </div>
    <div id="recentBox"><p class="f-lbl">Recent · tap to add</p><div class="chips wrap" id="recent"></div></div>
    <div id="items"></div>
    <button class="b line sm" type="button" id="addRow" style="margin-top:8px">＋ Another item</button>
    <p class="hint" id="rowHint">Enter jumps to the next item. Tap − / + to switch spent and earned.</p>
    <div class="f-total" id="fTotal" aria-live="polite"></div>
    <p class="err" id="editErr" hidden></p>
    <div class="acts fill" style="margin-top:14px">
      <button class="b warn" type="button" id="fDelete">Delete</button>
      <button class="b" type="button" id="fCancel">Cancel</button>
      <button class="b primary" type="submit" id="fSave">Save</button>
    </div>
  </form>
</dialog>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgText"></p>
  <div class="acts fill" style="margin-top:18px">
    <button class="b" type="button" id="dlgNo">Cancel</button>
    <button class="b primary" type="button" id="dlgYes">OK</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/panel.js"></script>
</body>
</html>
