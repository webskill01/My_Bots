<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbf8">
<meta name="robots" content="noindex">
<title>Schedule</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* mobile first; same design system as FB Pages Studio and the Washify admin panel */
  :root {
    --bg: #fbfbf8; --card: #fff; --ink: #1d1d1b; --muted: #62676a; --line: #e6e6e1; --soft: #f2f2ee;
    --accent: #0b6e76; --accent-soft: #e2f1f2;
    --deep: #a8660b; --deep-soft: #fbf0df; --ok: #1f7a4a; --ok-soft: #e1f3e8; --bad: #b3261e; --bad-soft: #fbe6e4;
    --info: #2851b5; --info-soft: #e7edfb;
    --r: 16px; --nav-h: 60px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  a { color: inherit; }
  p { margin: 0; }
  h1 { font-size: 21px; line-height: 1.15; letter-spacing: -.03em; margin: 0; }
  h2 { font-size: 14.5px; margin: 0 0 8px; letter-spacing: -.01em; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -.02em; font-size: 16px; text-decoration: none; white-space: nowrap; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; }

  /* shell. Phones (< 600) and tablets (600-959): top bar + bottom tab bar.
     Desktop (>= 960): tabs move into the top bar. Every top-bar item may
     shrink, so nothing is ever pushed off the right edge. */
  .top { position: sticky; top: 0; z-index: 5; background: rgba(251,251,248,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .top-in { max-width: 1240px; margin: 0 auto; padding: 8px max(12px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 10px; min-height: 52px; }
  .brand { flex: none; }
  .top .tabs { display: none; }
  .clock { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .clock .tz { font-size: 10.5px; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 5px; margin-left: 2px; }
  .bell { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--deep); background: var(--deep-soft); border-radius: 999px; padding: 4px 10px; text-decoration: none; white-space: nowrap; }
  .bell svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .bell .bt { display: none; }
  @media (max-width: 599px) { .clock .cd { display: none; } .bell { padding: 7px; } }
  @media (min-width: 600px) { .bell .bt { display: inline; } }
  @media (min-width: 960px) and (max-width: 1179px) { .clock .cd { display: none; } .bell .bt { display: none; } .bell { padding: 7px; } }
  html, body { overflow-x: hidden; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px max(12px, env(safe-area-inset-left)) calc(var(--nav-h) + 96px + env(safe-area-inset-bottom)); }
  @media (min-width: 600px) { main { padding-left: 20px; padding-right: 20px; } .top-in { padding-left: 20px; padding-right: 20px; } }
  .bottom { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .bottom a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; text-decoration: none; font-size: 11.5px; font-weight: 700; color: var(--muted); border-radius: 12px; }
  .bottom svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bottom a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
  @media (min-width: 600px) { .bottom { padding-left: max(6px, calc(50vw - 300px)); padding-right: max(6px, calc(50vw - 300px)); } h1 { font-size: 24px; } }
  @media (min-width: 960px) {
    .top .tabs { display: flex; gap: 2px; min-width: 0; }
    .top .tabs a { text-decoration: none; font-weight: 700; font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 12px; white-space: nowrap; }
    .top .tabs a[aria-current="page"] { color: var(--ink); background: var(--soft); }
    .bottom { display: none; }
    main { padding: 24px 24px 96px; }
    .top-in { padding-left: 24px; padding-right: 24px; }
  }
  .head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 14px; }
  .head > div:first-child { min-width: 0; }
  .head .sub { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  /* phones: always a row under the title; wider: always the right edge */
  @media (min-width: 600px) { .head { grid-template-columns: minmax(0, 1fr) auto; } }
  .nav { display: grid; grid-template-columns: 40px 104px 40px; gap: 6px; justify-content: start; }
  .nav .b { padding-left: 6px; padding-right: 6px; }
  /* "Today" keeps its slot on today (dimmed, inert), so the arrows never move */
  .nav .gap { opacity: .45; pointer-events: none; background: var(--soft); border-color: transparent; }

  /* cards & controls */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 10px; }
  @media (min-width: 600px) { .card { padding: 16px; } }
  label { display: block; font-size: 12.5px; font-weight: 700; margin: 12px 0 5px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; outline: none; min-height: 42px; }
  textarea { resize: vertical; min-height: 72px; line-height: 1.45; }
  input:disabled, select:disabled { background: var(--soft); color: var(--muted); }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; text-decoration: none; background: var(--soft); color: var(--ink); white-space: nowrap; }
  .b.primary { background: var(--accent); color: #fff; }
  .b.warn { background: var(--bad-soft); color: var(--bad); }
  .b.line { background: var(--card); border: 1.5px solid var(--line); }
  .b.sm { min-height: 32px; padding: 5px 10px; font-size: 12.5px; }
  .b.icon { width: 40px; padding: 0; }
  .b.full { width: 100%; padding: 11px; font-size: 15px; }
  .b svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .b:disabled { opacity: .45; cursor: default; }
  :is(.b, .bottom a, .tabs a, .chip, .row, .wi, .check, .day-t):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
  .acts.fill > .b { flex: 1 1 0; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 8px; padding: 1px 8px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .badge.now { background: var(--accent); color: #fff; }
  .badge.next { background: var(--info-soft); color: var(--info); }
  .badge.late { background: var(--bad-soft); color: var(--bad); }
  .badge.snz { background: var(--deep-soft); color: var(--deep); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--tc); background: color-mix(in srgb, var(--tc) 12%, #fff); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 22px 16px; text-align: center; border: 1.5px dashed var(--line); border-radius: var(--r); }
  .err { color: var(--bad); font-weight: 600; font-size: 13.5px; margin-top: 10px; }
  .note { font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--soft); margin-top: 12px; }
  .note.warn { background: var(--deep-soft); color: var(--deep); font-weight: 600; }
  .note.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }

  /* add form */
  .add { padding: 10px; margin-bottom: 14px; }
  .add-top { display: flex; gap: 8px; }
  .add-top input { flex: 1; font-weight: 600; }
  .add-top input { min-width: 0; }
  .add-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; align-items: end; }
  .add-opts > * { min-width: 0; }
  .add-opts .seg, .add-opts .days { grid-column: 1 / -1; margin: 0; }
  .add-opts .more { grid-column: 1 / -1; justify-self: start; }
  @media (max-width: 599px) { .add-opts .fld:has(#aDate) { grid-column: 1 / -1; } }   /* dd-mm-yyyy needs the width */
  @media (min-width: 600px) {   /* tablet: switch + day on one row, time + tag + more on the next */
    .add-opts { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .add-opts .seg, .add-opts .days { grid-column: span 3; }
    .add-opts .fld:has(#aDate) { grid-column: span 3; }
    .add-opts .fld:has(#aTime), .add-opts .fld:has(#aTag) { grid-column: span 2; }
    .add-opts .more { grid-column: span 2; justify-self: stretch; min-height: 38px; }
  }
  @media (min-width: 1100px) {  /* desktop: everything on one row */
    .add-opts { grid-template-columns: minmax(170px, auto) minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1.2fr) auto; }
    .add-opts .seg, .add-opts .days, .add-opts .fld:has(#aDate), .add-opts .fld:has(#aTime),
    .add-opts .fld:has(#aTag), .add-opts .more { grid-column: auto; }
    .add-opts .days { min-width: 250px; }
  }
  .fld { margin: 0; font-size: 11.5px; color: var(--muted); }
  .fld span { display: block; margin-bottom: 3px; }
  .fld input { min-height: 38px; padding: 6px 10px; font-size: 15px; min-width: 0; }
  input[type="date"], input[type="time"] { min-width: 0; -webkit-appearance: none; appearance: none; }
  .seg.sm { margin: 0; padding: 3px; }
  .seg.sm button { padding: 6px 8px; font-size: 12.5px; }
  .days.sm button { padding: 7px 0; font-size: 12px; }
  .add .hint { margin-top: 8px; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 6px; }
  .tile { min-width: 0; }
  @media (min-width: 600px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .tile .l { font-size: 12px; font-weight: 700; color: var(--muted); }
  .tile .v { font-size: 22px; font-weight: 800; letter-spacing: -.04em; line-height: 1.15; margin-top: 2px; }
  .tile .v.txt { font-size: 15px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .s { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .tile.goal { grid-column: 1 / -1; background: var(--ink); color: #fff; border-color: var(--ink); }
  @media (min-width: 600px) { .tile.goal { grid-column: auto; } }
  .tile.goal .l { color: rgba(255,255,255,.7); }
  .bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--ok); transition: width .3s; }

  /* task rows */
  .sec-h { display: flex; align-items: baseline; gap: 10px; margin: 20px 0 8px; }
  .sec-h h2 { margin: 0; font-size: 15.5px; }
  .cnt { font-weight: 700; font-size: 13px; color: var(--muted); }
  .list { display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 44px 64px 1fr auto; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--tc, var(--line)); border-radius: 14px; padding: 6px 10px 6px 6px; min-height: 60px; cursor: pointer; }
  .row:hover { border-color: #d6d6cf; border-left-color: var(--tc, #d6d6cf); }
  .row.cur { box-shadow: 0 0 0 2px var(--accent); }
  .row.done .t1 { text-decoration: line-through; color: var(--muted); }
  .row.done { opacity: .7; }
  .row .tm { font-size: 13px; font-weight: 800; line-height: 1.2; }
  .row .tm small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .row .t1 { font-weight: 700; font-size: 15px; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .row .t2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .row .t2 svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .row .r { display: grid; justify-items: end; gap: 4px; }
  .row .t3 { font-size: 12.5px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; }
  .nowline { display: flex; align-items: center; gap: 8px; color: var(--bad); font-size: 11.5px; font-weight: 800; margin: 2px 0; }
  .nowline::before, .nowline::after { content: ""; height: 2px; background: var(--bad); flex: 1; border-radius: 1px; }
  .nowline::before { flex: 0 0 10px; }
  .check { width: 40px; height: 40px; border-radius: 12px; border: 2px solid #cfcfc8; background: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .check svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
  .check[aria-pressed="true"] svg { opacity: 1; }
  .check:disabled { border-style: dashed; cursor: default; background: transparent; }

  /* chips */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 14px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--tc); flex: none; }

  /* week */
  .week { display: grid; gap: 10px; }
  @media (min-width: 600px) { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 960px) { .week { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1240px) { .week { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; } .week .wd { min-height: 320px; } }
  .wd { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-width: 0; }
  .wd.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .day-t { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; text-decoration: none; }
  .day-t b { font-size: 14px; }
  .day-t span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .wd.today .day-t b { color: var(--accent); }
  .wi { display: grid; grid-template-columns: 64px 1fr; gap: 6px; align-items: start; padding: 6px 6px 6px 8px; border-radius: 8px; border-left: 3px solid var(--tc, var(--line)); background: var(--bg); margin-bottom: 5px; cursor: pointer; font-size: 12.5px; }
  .wi:hover { background: var(--soft); }
  .wi .wt { font-weight: 800; color: var(--muted); font-size: 11.5px; padding-top: 1px; white-space: nowrap; }
  .wi .wn { font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
  .wi.done .wn { text-decoration: line-through; color: var(--muted); }
  @media (min-width: 960px) { .wi { grid-template-columns: 1fr; gap: 0; } }

  /* stats */
  .bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; align-items: end; height: 170px; margin-top: 6px; }
  .bars.many { gap: 2px; }
  .barcol { display: grid; grid-template-rows: auto 1fr auto; height: 100%; text-decoration: none; text-align: center; gap: 4px; min-width: 0; }
  .barcol .bv { font-size: 10.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .bars.many .bv { visibility: hidden; }
  .barcol .bt { background: var(--soft); border-radius: 6px; display: flex; align-items: flex-end; overflow: hidden; }
  .barcol .bt i { display: block; width: 100%; background: var(--ok); border-radius: 6px 6px 0 0; }
  .barcol .bt i.today { background: var(--accent); }
  .barcol .bl { font-size: 11px; font-weight: 700; color: var(--muted); }
  .mrow { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 44px; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .mrow:first-of-type { border-top: 0; }
  .mrow .ml { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .mrow .mv { text-align: right; font-weight: 700; color: var(--muted); font-size: 12.5px; }
  .meter { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--ok); }

  /* settings */
  details.help { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.help summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--accent); }
  details.help p { margin-top: 8px; }
  .steps { margin: 8px 0 0; padding-left: 20px; font-size: 13.5px; display: grid; gap: 4px; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .srow:first-of-type { border-top: 0; padding-top: 4px; }
  .srow .tx { min-width: 0; }
  .srow .tx b { display: block; font-size: 14px; }
  .srow .tx span { font-size: 12.5px; color: var(--muted); }
  .inrow { display: flex; gap: 8px; }
  .link { display: flex; gap: 6px; align-items: center; margin-top: 10px; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--ok-soft); }
  .link code { flex: 1; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ok); font-weight: 600; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px; background: var(--soft); color: var(--muted); }
  .pill.off { background: var(--bad-soft); color: var(--bad); }
  .pill.admin { background: var(--accent-soft); color: var(--accent); }

  /* floating add */
  .fab { position: fixed; right: 16px; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom)); z-index: 6; width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(11,110,118,.35); cursor: pointer; }
  .fab svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; fill: none; }
  @media (min-width: 960px) { .fab { bottom: 28px; right: max(24px, calc(50vw - 600px)); } }

  /* dialogs */
  dialog { border: 0; border-radius: 20px; padding: 18px; width: min(460px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow-y: auto; overscroll-behavior: contain; box-shadow: 0 20px 60px rgba(0,0,0,.25); color: var(--ink); }
  dialog::backdrop { background: rgba(20,20,18,.45); }
  dialog h2 { font-size: 18px; margin-bottom: 6px; }
  dialog p { color: var(--muted); font-size: 14px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--soft); border-radius: 12px; padding: 4px; margin-top: 12px; }
  .seg button { border: 0; background: none; font: inherit; font-weight: 700; font-size: 13.5px; padding: 8px; border-radius: 9px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .days button { border: 1.5px solid var(--line); background: #fff; font: inherit; font-weight: 700; font-size: 13px; padding: 8px 0; border-radius: 10px; cursor: pointer; }
  .days button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .presets { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  /* small phones: form fields stack, dialog buttons go two per row */
  @media (max-width: 399px) {
    dialog .two { grid-template-columns: minmax(0, 1fr); gap: 0; }
    dialog .acts.fill { flex-wrap: wrap; }
    dialog .acts.fill > .b { flex: 1 1 calc(50% - 6px); }
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .toast { position: fixed; left: 12px; right: 12px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); max-width: 440px; margin: 0 auto; background: var(--ink); color: #fff; padding: 13px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; transform: translateY(calc(100% + 160px)); visibility: hidden; transition: transform .25s ease, visibility .25s; z-index: 30; }
  @media (min-width: 960px) { .toast { bottom: 24px; } }
  .toast.show { transform: none; visibility: visible; }
  .toast.err { background: var(--bad); }
  .spin { width: 22px; height: 22px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; margin: 60px auto; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .toast, .bar i { transition: none; } .spin { animation-duration: 3s; } }
</style>
</head>
<body>
<section id="login" hidden>
  <main style="max-width:380px;padding-top:14vh">
    <p class="brand" style="justify-content:center;margin-bottom:6px"><img src="/icon-192.png" alt="">Schedule</p>
    <p class="muted" style="text-align:center;margin-bottom:18px">Routine, tasks and reminders</p>
    <form class="card" id="loginForm">
      <label for="un" style="margin-top:0">Name</label>
      <input id="un" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="b primary full" type="submit" style="margin-top:14px">Log in</button>
      <p class="err" id="loginErr" hidden></p>
    </form>
    <p class="muted small" style="text-align:center;margin-top:12px">New here? Ask for an invite link.</p>
  </main>
</section>

<section id="joinSec" hidden>
  <main style="max-width:380px;padding-top:10vh">
    <p class="brand" style="justify-content:center;margin-bottom:6px"><img src="/icon-192.png" alt="">Schedule</p>
    <p class="muted" style="text-align:center;margin-bottom:18px" id="joinSub">Create your account</p>
    <form class="card" id="joinForm">
      <label for="jName" style="margin-top:0">Your name</label>
      <input id="jName" autocomplete="username" autocapitalize="words" required minlength="2" maxlength="32">
      <p class="hint">You'll log in with this. Letters, numbers, spaces.</p>
      <label for="jPw">Password</label>
      <input id="jPw" type="password" autocomplete="new-password" required minlength="6">
      <label for="jPw2">Password again</label>
      <input id="jPw2" type="password" autocomplete="new-password" required minlength="6">
      <button class="b primary full" type="submit" style="margin-top:14px">Create account</button>
      <p class="err" id="joinErr" hidden></p>
    </form>
  </main>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#today"><img src="/icon-192.png" alt=""><span>Schedule</span></a>
      <nav class="tabs" aria-label="Sections"></nav>
      <span class="clock" id="clock"></span>
      <a class="bell" id="bell" href="#settings" hidden aria-label="Turn on reminders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="bt">Turn on reminders</span></a>
    </div>
  </header>
  <main id="view"><div class="spin"></div></main>
  <nav class="bottom" aria-label="Sections"></nav>
  <button class="fab" id="fab" type="button" aria-label="Add a task"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<dialog id="edit" aria-labelledby="editTitle">
  <form id="editForm" method="dialog">
    <h2 id="editTitle">New task</h2>
    <label for="fTitle" style="margin-top:4px">Title</label>
    <input id="fTitle" maxlength="100" required autocomplete="off">
    <div class="seg" role="group" aria-label="How often">
      <button type="button" data-kind="once">One time</button>
      <button type="button" data-kind="daily">Repeats</button>
    </div>
    <div id="onceBox">
      <label for="fDate">Date</label>
      <input id="fDate" type="date">
    </div>
    <div id="dailyBox">
      <label>Days</label>
      <div class="days" id="fDays"></div>
      <div class="presets">
        <button class="b sm line" type="button" data-preset="127">Every day</button>
        <button class="b sm line" type="button" data-preset="63">Mon–Sat</button>
        <button class="b sm line" type="button" data-preset="31">Weekdays</button>
        <button class="b sm line" type="button" data-preset="96">Weekend</button>
      </div>
    </div>
    <div class="two">
      <div>
        <label for="fTime">Starts (IST)</label>
        <input id="fTime" type="time">
      </div>
      <div>
        <label for="fEnd">Ends <span class="muted">(optional)</span></label>
        <input id="fEnd" type="time">
      </div>
    </div>
    <p class="hint" id="timeHint">No time means no reminder: it shows under Anytime.</p>
    <div class="two" id="remindRow">
      <div>
        <label for="fRemind">Remind me</label>
        <select id="fRemind">
          <option value="0">At start time</option><option value="5">5 min before</option>
          <option value="10">10 min before</option><option value="15">15 min before</option>
          <option value="30">30 min before</option><option value="60">1 hour before</option>
        </select>
      </div>
      <div>
        <label for="fTag">Tag</label>
        <input id="fTag" list="tagList" autocomplete="off" placeholder="none">
      </div>
    </div>
    <label for="fNotes">Notes <span class="muted">(optional)</span></label>
    <textarea id="fNotes" rows="3" maxlength="1000" placeholder="Checklist, link, script idea…"></textarea>
    <p class="err" id="editErr" hidden></p>
    <div class="acts fill" style="margin-top:18px">
      <button class="b warn" type="button" id="fDelete">Delete</button>
      <button class="b line" type="button" id="fDup">Duplicate</button>
      <button class="b" type="button" id="fCancel">Cancel</button>
      <button class="b primary" type="submit" id="fSave">Save</button>
    </div>
  </form>
</dialog>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgText"></p>
  <div class="acts fill" style="margin-top:18px">
    <button class="b" type="button" id="dlgNo">Cancel</button>
    <button class="b primary" type="button" id="dlgYes">OK</button>
  </div>
</dialog>

<datalist id="tagList"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/panel.js"></script>
</body>
</html>
